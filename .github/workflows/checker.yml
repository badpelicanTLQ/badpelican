name: Vérifier les tournois BadNet

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: badnet-tournament-checker
  cancel-in-progress: false

jobs:
  check-tournaments:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Vérifier les tournois et envoyer les alertes
        id: checker
        continue-on-error: true
        env:
          WHATSAPP_INSTANCE_ID: ${{ secrets.WHATSAPP_INSTANCE_ID }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_CHAT_ID: ${{ secrets.WHATSAPP_CHAT_ID }}
        run: python main.py

      - name: Enregistrer l'état des notifications
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sent_tournaments.json
          if git diff --cached --quiet; then
            echo "Aucun nouvel état à enregistrer."
          else
            git commit -m "chore: update tournament notification state"
            git push
          fi

      - name: Signaler un échec du vérificateur
        if: steps.checker.outcome == 'failure'
        run: exit 1
